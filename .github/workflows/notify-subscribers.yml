name: Notify Subscribers
on:
  issues:
    types: [opened, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "What a manual run should do"
        type: choice
        default: diagnose
        options:
          - diagnose # read-only: report newsletter and subscriber counts
          - draft # stage a Buttondown draft, mail nobody
          - send # really send, exactly as a live incident would

permissions:
  issues: read

jobs:
  notify:
    # Upptime incident issues are labeled with the site slug (e.g. doc-ai-fabric-production).
    # A manual run carries no issue payload, so let it through unconditionally.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.issue.labels.*.name, ','), 'doc-ai-fabric')
    runs-on: ubuntu-latest
    steps:
      - name: Send email to subscribers via Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || '🛠️ Test notification (manual run)' }}
          ISSUE_URL: ${{ github.event.issue.html_url || 'https://github.com/docaifabric/status' }}
          ISSUE_ACTION: ${{ github.event.action }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "BUTTONDOWN_API_KEY secret is not set; skipping subscriber notification."
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.request

          API = "https://api.buttondown.com/v1"
          KEY = os.environ["BUTTONDOWN_API_KEY"]
          # An issues-triggered run has no MODE and must always really send.
          mode = os.environ.get("MODE") or "send"


          def call(method, path, payload=None):
              req = urllib.request.Request(
                  API + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={
                      "Authorization": "Token " + KEY,
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  # Buttondown explains every rejection in the response body,
                  # which urlopen discards when it raises. Read it so failures
                  # are diagnosable instead of a bare "400: Bad Request".
                  return e.code, {"error_body": e.read().decode("utf-8", "replace")}
              except urllib.error.URLError as e:
                  return None, {"error_body": f"could not reach Buttondown: {e.reason}"}


          if mode == "diagnose":
              for path in (
                  "/newsletters",
                  "/subscribers",
                  "/subscribers?type=regular",
                  "/subscribers?type=unactivated",
              ):
                  code, data = call("GET", path)
                  if isinstance(data, dict) and "results" in data:
                      data = {"count": data.get("count"), "returned": len(data["results"])}
                  print(f"GET {path} -> {code}: {json.dumps(data)[:1000]}")
              # Deliberately invalid, and missing subject/body too, so the
              # request cannot create or send anything. Buttondown validates
              # every field at once, so the rejection enumerates the status
              # values the API actually accepts.
              code, data = call("POST", "/emails", {"status": "__probe_invalid__"})
              print(f"POST /emails (probe) -> {code}: {json.dumps(data)[:2000]}")
              raise SystemExit(0)

          title = os.environ["ISSUE_TITLE"]
          url = os.environ["ISSUE_URL"]
          resolved = os.environ["ISSUE_ACTION"] == "closed"

          subject = f"✅ Resolved: {title}" if resolved else title
          body = (
              f"**{'Incident resolved' if resolved else 'Incident started'}:** {title}\n\n"
              f"Live status: https://status.docaifabric.com\n\n"
              f"Incident details: {url}\n"
          )

          status = "draft" if mode == "draft" else "about_to_send"
          code, data = call("POST", "/emails", {"subject": subject, "body": body, "status": status})
          if code is not None and 200 <= code < 300:
              print(f"Buttondown accepted the email ({status}): HTTP {code}")
          else:
              print(f"Buttondown rejected the email ({status}): HTTP {code}")
              print("Response body:", data.get("error_body"))
              raise SystemExit(1)
          EOF
